name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven    # caches ~/.m2 between runs — speeds up subsequent builds significantly

      - name: Build and test
        run: mvn -B clean verify
        # -B = batch mode (no interactive prompts, cleaner CI output)
        # verify = compile + test + package (but not install to local repo)
        # Testcontainers will pull Redis from Docker Hub automatically

      # Week 7: uncomment to build and push the Docker image
