spring:
  application:
    name: flowgate-service

  data:
    redis:
      # Override with env vars in production: SPRING_DATA_REDIS_HOST, etc.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # password: ${REDIS_PASSWORD:}  # uncomment if Redis auth is enabled
      lettuce:
        pool:
          max-active: 10    # max connections in pool (tune based on load test results)
          max-idle: 5
          min-idle: 2
          max-wait: 2000ms  # how long to wait for a connection before failing

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics,info  # Prometheus scrapes /actuator/prometheus
  endpoint:
    health:
      show-details: always   # expose Redis connection status in /actuator/health
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}  # tag all metrics with app name

# Flowgate-specific configuration
# (bound to a @ConfigurationProperties class in Week 4)
flowgate:
  redis:
    key-prefix: "fg:"           # namespace all Redis keys to avoid collisions with other apps
    connection-timeout: 2000    # ms — fail fast if Redis is unreachable
  default-algorithm: TOKEN_BUCKET
  fail-open: true               # if Redis is down: true = allow requests, false = reject all
                                # fail-open is safer for most APIs (availability > correctness)
                                # fail-closed is right for security-critical endpoints
