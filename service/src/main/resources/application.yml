spring:
  application:
    name: flowgate-service
  # Read by FlowgateAutoConfiguration's flowgateRedisClient() bean.
  # Defaults already match this (localhost:6379), but declared explicitly
  # here so the connection settings are visible and easy to change for
  # a non-local Redis instance.
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.flowgate: DEBUG