# Pin the Docker Remote API version used by Testcontainers' docker-java client.
#
# Why this file exists:
#   docker-java does not negotiate an API version on its own. When the version is
#   left unset, Testcontainers' DockerClientProviderStrategy falls back to a
#   hardcoded API version 1.32. Docker Engine 29.x (Docker Desktop 4.77+) rejects
#   anything below 1.40 with an HTTP 400 on /info:
#       "client version 1.32 is too old. Minimum supported API version is 1.40"
#   which surfaces as the misleading "Could not find a valid Docker environment".
#
# docker-java loads this file from the classpath automatically (the filename is
# fixed: docker-java.properties). Setting api.version makes the config report a
# concrete version, so Testcontainers skips its 1.32 fallback and the daemon
# accepts the request. 1.44 is well within the engine's supported range.
api.version=1.44
